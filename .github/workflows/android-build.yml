name: Build SHOMER Nature Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install
      - name: Copy live web app into native shell (native CSP patch)
        working-directory: native
        run: node scripts/copy-web.js
      - name: Add Android platform
        working-directory: native
        run: npx cap add android
      - name: "Patch SDK levels, Gradle/AGP and version (Play minSdk24, target/compile 36)"
        working-directory: native/android
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/' variables.gradle
          sed -i -E 's/compileSdkVersion *= *[0-9]+/compileSdkVersion = 36/' variables.gradle
          sed -i -E 's/targetSdkVersion *= *[0-9]+/targetSdkVersion = 36/' variables.gradle
          sed -i -E 's#com\.android\.tools\.build:gradle:[0-9.]+#com.android.tools.build:gradle:8.11.1#' build.gradle
          sed -i -E 's#gradle-[0-9.]+-all\.zip#gradle-8.13-all.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          echo "--- version ---"; grep -nE "versionCode|versionName" app/build.gradle
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Merge Android manifest additions (permissions)
        working-directory: native
        run: node scripts/apply-manifest.js || echo "manifest merge optional"
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shomer-nature-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
